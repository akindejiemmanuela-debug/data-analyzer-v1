<!DOCTYPE html>
<html>
<head>

<title>Saved Dashboards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>📂 My Saved Dashboards</h2>

<table class="table table-striped">

<tr>
<th>Name</th>
<th>Dataset</th>
<th>X Axis</th>
<th>Y Axis</th>
<th>Action</th>
</tr>

{% for d in dashboards %}

<tr>

<td>{{ d["dashboard_name"] }}</td>

<td>{{ d["filename"] }}</td>

<td>{{ d["x_column"] }}</td>

<td>{{ d["y_column"] }}</td>

<td>

<a href="/open_dashboard/{{ d['id'] }}"
class="btn btn-primary btn-sm">
📂 Open
</a>

<a href="/edit_dashboard/{{ d['id'] }}"
class="btn btn-warning btn-sm">
✏️ Rename
</a>

<a href="/share_dashboard/{{ d['id'] }}"
class="btn btn-success btn-sm">
🔗 Share
</a>

<a href="/delete_dashboard/{{ d['id'] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this dashboard?')">
🗑 Delete
</a>

</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
