<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Group By Analysis</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-success text-white">

            <h3 class="text-center">
                Group By Analysis
            </h3>

        </div>

        <div class="card-body">

            <form
                action="{{ url_for('groupby_result') }}"
                method="POST"
            >

                <!-- IMPORTANT: Keep workspace ID -->
                <input
                    type="hidden"
                    name="workspace_id"
                    value="{{ workspace_id }}"
                >

                <!-- GROUP COLUMN -->

                <div class="mb-3">

                    <label class="form-label">
                        Group By Column
                    </label>

                    <select
                        name="group_column"
                        class="form-select"
                        required
                    >

                        <option value="" disabled selected>
                            Select group column
                        </option>

                        {% for column in columns %}

                        <option value="{{ column }}">
                            {{ column }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- VALUE COLUMN -->

                <div class="mb-3">

                    <label class="form-label">
                        Value Column
                    </label>

                    <select
                        name="value_column"
                        class="form-select"
                        required
                    >

                        <option value="" disabled selected>
                            Select value column
                        </option>

                        {% for column in columns %}

                        <option value="{{ column }}">
                            {{ column }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- OPERATION -->

                <div class="mb-3">

                    <label class="form-label">
                        Operation
                    </label>

                    <select
                        name="operation"
                        class="form-select"
                        required
                    >

                        <option value="sum">
                            Sum
                        </option>

                        <option value="mean">
                            Mean
                        </option>

                        <option value="count">
                            Count
                        </option>

                        <option value="min">
                            Minimum
                        </option>

                        <option value="max">
                            Maximum
                        </option>

                        <option value="std">
                            Standard Deviation
                        </option>

                        <option value="var">
                            Variance
                        </option>

                        <option value="prod">
                            Product
                        </option>

                        <option value="first">
                            First
                        </option>

                        <option value="last">
                            Last
                        </option>

                        <option value="nunique">
                            Unique Count
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    Perform Group By
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
