<!DOCTYPE html>
<html>

<head>
    <title>Share Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>🔗 Share Dashboard</h2>

    <input
        type="text"
        id="shareLink"
        class="form-control"
        value="{{ link }}"
        readonly>

    <button class="btn btn-success mt-3"
            onclick="copyLink()">
        📋 Copy Link
    </button>

</div>

<script>

function copyLink(){

    let input = document.getElementById("shareLink");

    input.select();

    document.execCommand("copy");

    alert("Link copied!");

}

</script>

</body>

</html>
