<!DOCTYPE html>
<html>

<head>

<title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,Helvetica,sans-serif;
}

.card{
width:450px;
border:none;
border-radius:20px;
}

.card-header{
background:#198754;
color:white;
text-align:center;
font-size:25px;
font-weight:bold;
padding:20px;
border-radius:20px 20px 0 0;
}

.btn{
border-radius:30px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="card shadow-lg">

<div class="card-header">
Create Account
</div>

<div class="card-body">

<form action="/register" method="POST">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
name="fullname"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirm"
class="form-control"
required>

</div>

<button class="btn btn-success w-100">
Register
</button>

</form>

<br>

<p class="text-center">

Already have an account?

<a href="/login">
Login
</a>

</p>

</div>

</div>

</body>

</html>
